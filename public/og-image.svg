<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <rect width="1200" height="630" fill="#0c0c0c"/>

  <!-- N mark watermark -->
  <g transform="translate(900, 100)" opacity="0.05">
    <rect x="0" y="0" width="38" height="190" fill="#c8ff00"/>
    <rect x="148" y="0" width="38" height="190" fill="#c8ff00"/>
    <polygon points="38,0 86,0 186,190 138,190" fill="#c8ff00"/>
  </g>

  <!-- Top border accent -->
  <rect x="0" y="0" width="1200" height="3" fill="#c8ff00" opacity="0.4"/>

  <!-- Label -->
  <text x="80" y="200" font-family="ui-monospace,Courier New,monospace" font-size="13"
